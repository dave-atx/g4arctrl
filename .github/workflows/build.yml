name: build

# Every push and PR builds the packages and the Raspberry Pi 5 images. A vX.Y.Z
# tag also publishes them: a GitHub release with the .apk files and images, and
# the apk repository on GitHub Pages. A vX.Y.Z-rN tag rebuilds only the images
# (e.g. for a fix in an OpenWrt package): a release with the images, and the
# repository on Pages stays as it is.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_VERSION: 25.12.6

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The CLI and the scripts run under busybox ash on the router.
      - name: shellcheck and shfmt
        run: |
          sudo apt-get install -y --no-install-recommends shfmt
          shellcheck -s sh tmhi tmhi.init tmhi.hotplug openwrt/tmog4ar/files/tmog4ar-to-tmhi openwrt/sdk-build.sh openwrt/image/*.sh openwrt/image/image-upgrade
          shfmt -ln posix -d tmhi tmhi.init tmhi.hotplug openwrt/tmog4ar/files/tmog4ar-to-tmhi openwrt/sdk-build.sh openwrt/image/*.sh openwrt/image/image-upgrade

      - name: eslint (LuCI views)
        run: npx --yes eslint -c openwrt/luci-app-tmhi/eslint.config.mjs openwrt/luci-app-tmhi

      - name: JSON (menu, ACL)
        run: for f in openwrt/luci-app-tmhi/root/usr/share/*/*/*.json; do jq empty "$f" || exit 1; done

  package:
    name: package
    needs: lint
    runs-on: ubuntu-latest
    # The SDK download from the OpenWrt mirrors can stall with no error; a
    # normal build takes 5-25 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag=${GITHUB_REF_NAME#v}
          tag=${tag%-r[0-9]*}
          script=$(sed -n 's/^VERSION=\([^ ]*\).*/\1/p' tmhi)
          pkg=$(sed -n 's/^PKG_VERSION:=//p' openwrt/tmhi/Makefile)
          luci=$(sed -n 's/^PKG_VERSION:=//p' openwrt/luci-app-tmhi/Makefile)
          old=$(sed -n 's/^PKG_VERSION:=//p' openwrt/tmog4ar/Makefile)
          echo "tag $tag, script $script, package $pkg, luci-app $luci, tmog4ar $old"
          [ "$tag" = "$script" ] && [ "$tag" = "$pkg" ] && [ "$tag" = "$luci" ] && [ "$tag" = "$old" ]

      # The SDK takes 5-20 minutes, so keep the built repository and skip it
      # when nothing it's built from has changed (image-only changes, -rN
      # rebuilds). Tags and PRs can restore what main saved.
      - name: Restore the repository
        id: cache
        uses: actions/cache@v5
        with:
          path: repo
          key: repo-${{ env.OPENWRT_VERSION }}-${{ hashFiles('tmhi', 'tmhi.init', 'tmhi.config', 'tmhi.hotplug', 'openwrt/tmog4ar.pem', 'openwrt/tmhi/**', 'openwrt/luci-app-tmhi/**', 'openwrt/tmog4ar/**', 'openwrt/sdk-build.sh') }}

      # Both packages are noarch, so any SDK will do. The LuCI app is built
      # with luci.mk, so the default feeds (which include luci) stay on.
      # Not openwrt/gh-action-sdk: it downloads the SDK again from the OpenWrt
      # mirrors although the release container already has it, and a slow
      # mirror (mirror-03, 21 KB/s) hung the job.
      - name: Build with the OpenWrt SDK
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          mkdir -p bin
          chmod 777 bin
          docker run --rm -e PRIVATE_KEY -v "$PWD:/src:ro" -v "$PWD/bin:/builder/bin" \
            "ghcr.io/openwrt/sdk:aarch64_generic-$OPENWRT_VERSION" \
            sh /src/openwrt/sdk-build.sh

      - name: Collect the repository
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir repo
          cp bin/packages/aarch64_generic/action/packages.adb \
             bin/packages/aarch64_generic/action/tmhi-*.apk \
             bin/packages/aarch64_generic/action/luci-app-tmhi-*.apk \
             bin/packages/aarch64_generic/action/tmog4ar-*.apk \
             bin/packages/aarch64_generic/action/luci-app-tmog4ar-*.apk \
             openwrt/tmog4ar.pem repo/
          ls -l repo

      # Install from the repository the way a router would: with tmog4ar.pem
      # trusted and no --allow-untrusted. Fails if the index isn't signed with
      # the key in this repo. Forks' PRs don't get the secret, so skip those.
      - name: Install from the repository
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          docker run --rm -v "$PWD/repo:/repo:ro" \
            "ghcr.io/openwrt/rootfs:x86_64-$OPENWRT_VERSION" sh -c '
              set -e
              cp /repo/tmog4ar.pem /etc/apk/keys/
              echo /repo/packages.adb >> /etc/apk/repositories.d/customfeeds.list
              apk update
              apk add tmhi luci-app-tmhi
              tmhi version
              uci -q get tmhi.main.host
              # The transitional package moves tmog4ar settings over.
              printf "config tmog4ar main\n\toption host 192.0.2.1\n" >/etc/config/tmog4ar
              apk add tmog4ar luci-app-tmog4ar
              [ "$(uci -q get tmhi.main.host)" = 192.0.2.1 ] && [ ! -e /etc/config/tmog4ar ]
              tmog4ar version'

      - uses: actions/upload-artifact@v7
        with:
          name: repo
          path: repo/

  image:
    name: rpi-5 images
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: repo
          path: repo

      # Packages the Image Builder downloaded last time. apk checks them
      # against the current feed indexes and fetches only what changed. Each
      # run saves a new cache; old ones age out.
      - uses: actions/cache@v5
        with:
          path: dl
          key: ib-dl-${{ env.OPENWRT_VERSION }}-${{ github.run_id }}
          restore-keys: ib-dl-${{ env.OPENWRT_VERSION }}-

      # One container builds every image in openwrt/image/variants/. It runs
      # as uid 1000, so the directories it writes must be writable by it.
      - name: Build with the OpenWrt Image Builder
        run: |
          mkdir -p image dl
          chmod 777 image dl
          case $GITHUB_REF in
            refs/tags/*) tag=$GITHUB_REF_NAME ;;
            *) tag=dev-${GITHUB_SHA::7} ;;
          esac
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/image:/out" \
            -v "$PWD/dl:/builder/dl" \
            -e IMAGE_TAG="$tag" -e IMAGE_REPO="$GITHUB_REPOSITORY" \
            "ghcr.io/openwrt/imagebuilder:bcm27xx-bcm2712-$OPENWRT_VERSION" \
            sh /src/openwrt/image/build.sh /src/repo /out

      # Uploaded even if the version check at the end of build.sh failed, to
      # see what the images would have had.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: image
          path: |
            image/*.img.gz
            image/*.manifest
            image/sha256sums

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # All of history and the tags, for git-cliff.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8

      - name: Install git-cliff
        run: |
          curl -fsSL -o git-cliff.tar.gz \
            https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz
          echo "24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4  git-cliff.tar.gz" | sha256sum -c
          tar xzf git-cliff.tar.gz --strip-components=1 -C "$RUNNER_TEMP" git-cliff-2.14.2/git-cliff
          echo "$RUNNER_TEMP" >>"$GITHUB_PATH"

      # The notes start with what changed in the packages (cliff.toml, from
      # the commits' Release-note lines; not for an image-only -rN release),
      # then each image's package changes since the previous release, then
      # GitHub's list of merged PRs.
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts \
            --json tagName,createdAt --jq "map(select(.tagName != \"$GITHUB_REF_NAME\")) | sort_by(.createdAt) | last | .tagName // empty")
          mkdir prev
          if [ -n "$prev" ]; then
            gh release download "$prev" --repo "$GITHUB_REPOSITORY" --dir prev --pattern '*.manifest'
          fi
          case $GITHUB_REF_NAME in
            *-r[0-9]*) : >notes.md ;;
            *)
              # The commits since the previous X.Y.Z tag, named after this
              # tag. Not --latest: that loses the tag when the tagged commit
              # doesn't touch the packages (cliff.toml include_paths).
              since=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-r[0-9]*' "$GITHUB_REF_NAME^" 2>/dev/null) || since=''
              git-cliff --config cliff.toml --tag "$GITHUB_REF_NAME" --strip all \
                "${since:+$since..}$GITHUB_REF_NAME" >notes.md
              echo >>notes.md
              ;;
          esac
          sh openwrt/image/release-notes.sh "$prev" prev image >>notes.md
          cat notes.md

      # --latest: image-upgrade on the routers takes the latest release, and
      # GitHub could rank v0.2.0-r1 below v0.2.0 (a semver prerelease).
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case $GITHUB_REF_NAME in
            *-r[0-9]*) set -- ;;
            *) set -- repo/tmhi-*.apk repo/luci-app-tmhi-*.apk repo/tmog4ar-*.apk repo/luci-app-tmog4ar-*.apk repo/tmog4ar.pem ;;
          esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$GITHUB_REF_NAME" --latest \
            --notes "$(cat notes.md)" --generate-notes \
            "$@" image/*.img.gz image/*.manifest image/sha256sums

  pages:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-r')
    needs: [package, image]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: repo
          path: repo

      - uses: actions/upload-pages-artifact@v5
        with:
          path: repo

      - id: deploy
        uses: actions/deploy-pages@v5
