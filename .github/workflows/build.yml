name: build

# Every push and PR builds the packages and the Raspberry Pi 5 images. A vX.Y.Z
# tag also publishes them: a GitHub release with the .apk files and images, and
# the apk repository on GitHub Pages. A vX.Y.Z-rN tag rebuilds only the images
# (e.g. for a fix in an OpenWrt package): a release with the images, and the
# repository on Pages stays as it is.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENWRT_VERSION: 25.12.6

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The CLI and the scripts run under busybox ash on the router.
      - name: shellcheck and shfmt
        run: |
          sudo apt-get install -y --no-install-recommends shfmt
          shellcheck -s sh tmog4ar tmog4ar.init openwrt/image/*.sh
          shfmt -ln posix -d tmog4ar tmog4ar.init openwrt/image/*.sh

      - name: eslint (LuCI views)
        run: npx --yes eslint -c openwrt/luci-app-tmog4ar/eslint.config.mjs openwrt/luci-app-tmog4ar

      - name: JSON (menu, ACL)
        run: for f in openwrt/luci-app-tmog4ar/root/usr/share/*/*/*.json; do jq empty "$f" || exit 1; done

  package:
    name: package
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag=${GITHUB_REF_NAME#v}
          tag=${tag%-r[0-9]*}
          script=$(sed -n 's/^VERSION=\([^ ]*\).*/\1/p' tmog4ar)
          pkg=$(sed -n 's/^PKG_VERSION:=//p' openwrt/tmog4ar/Makefile)
          luci=$(sed -n 's/^PKG_VERSION:=//p' openwrt/luci-app-tmog4ar/Makefile)
          echo "tag $tag, script $script, package $pkg, luci-app $luci"
          [ "$tag" = "$script" ] && [ "$tag" = "$pkg" ] && [ "$tag" = "$luci" ]

      # The SDK takes 5-20 minutes, so keep the built repository and skip it
      # when nothing it's built from has changed (image-only changes, -rN
      # rebuilds). Tags and PRs can restore what main saved.
      - name: Restore the repository
        id: cache
        uses: actions/cache@v5
        with:
          path: repo
          key: repo-${{ env.OPENWRT_VERSION }}-${{ hashFiles('tmog4ar', 'tmog4ar.init', 'tmog4ar.config', 'openwrt/tmog4ar.pem', 'openwrt/tmog4ar/**', 'openwrt/luci-app-tmog4ar/**') }}

      # Both packages are noarch, so any SDK will do. The LuCI app is built
      # with luci.mk, so the default feeds (which include luci) stay on.
      - name: Build with the OpenWrt SDK
        if: steps.cache.outputs.cache-hit != 'true'
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434 # main, 2026-08-04
        env:
          ARCH: aarch64_generic-${{ env.OPENWRT_VERSION }}
          PACKAGES: tmog4ar luci-app-tmog4ar
          INDEX: 1
          PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}

      - name: Collect the repository
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir repo
          cp bin/packages/aarch64_generic/action/packages.adb \
             bin/packages/aarch64_generic/action/tmog4ar-*.apk \
             bin/packages/aarch64_generic/action/luci-app-tmog4ar-*.apk \
             openwrt/tmog4ar.pem repo/
          ls -l repo

      # Install from the repository the way a router would: with tmog4ar.pem
      # trusted and no --allow-untrusted. Fails if the index isn't signed with
      # the key in this repo. Forks' PRs don't get the secret, so skip those.
      - name: Install from the repository
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          docker run --rm -v "$PWD/repo:/repo:ro" \
            "ghcr.io/openwrt/rootfs:x86_64-$OPENWRT_VERSION" sh -c '
              set -e
              cp /repo/tmog4ar.pem /etc/apk/keys/
              echo /repo/packages.adb >> /etc/apk/repositories.d/customfeeds.list
              apk update
              apk add tmog4ar luci-app-tmog4ar
              tmog4ar version
              uci -q get tmog4ar.main.host'

      - uses: actions/upload-artifact@v7
        with:
          name: repo
          path: repo/

  image:
    name: rpi-5 images
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: repo
          path: repo

      # Packages the Image Builder downloaded last time. apk checks them
      # against the current feed indexes and fetches only what changed. Each
      # run saves a new cache; old ones age out.
      - uses: actions/cache@v5
        with:
          path: dl
          key: ib-dl-${{ env.OPENWRT_VERSION }}-${{ github.run_id }}
          restore-keys: ib-dl-${{ env.OPENWRT_VERSION }}-

      # One container builds every image in openwrt/image/variants/. It runs
      # as uid 1000, so the directories it writes must be writable by it.
      - name: Build with the OpenWrt Image Builder
        run: |
          mkdir -p image dl
          chmod 777 image dl
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/image:/out" \
            -v "$PWD/dl:/builder/dl" \
            "ghcr.io/openwrt/imagebuilder:bcm27xx-bcm2712-$OPENWRT_VERSION" \
            sh /src/openwrt/image/build.sh /src/repo /out

      # Uploaded even if the version check at the end of build.sh failed, to
      # see what the images would have had.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: image
          path: |
            image/*.img.gz
            image/*.manifest
            image/sha256sums

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8

      # The notes list each image's package changes since the previous
      # release, then GitHub's list of merged PRs.
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts \
            --json tagName,createdAt --jq "map(select(.tagName != \"$GITHUB_REF_NAME\")) | sort_by(.createdAt) | last | .tagName // empty")
          mkdir prev
          if [ -n "$prev" ]; then
            gh release download "$prev" --repo "$GITHUB_REPOSITORY" --dir prev --pattern '*.manifest'
          fi
          sh openwrt/image/release-notes.sh "$prev" prev image | tee notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case $GITHUB_REF_NAME in
            *-r[0-9]*) set -- ;;
            *) set -- repo/tmog4ar-*.apk repo/luci-app-tmog4ar-*.apk repo/tmog4ar.pem ;;
          esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "$(cat notes.md)" --generate-notes \
            "$@" image/*.img.gz image/*.manifest image/sha256sums

  pages:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-r')
    needs: [package, image]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: repo
          path: repo

      - uses: actions/upload-pages-artifact@v5
        with:
          path: repo

      - id: deploy
        uses: actions/deploy-pages@v5
