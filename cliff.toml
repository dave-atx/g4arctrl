# git-cliff config for the package release notes (tmhi, luci-app-tmhi and the
# transitional tmog4ar packages). CI runs `git-cliff --latest` for a vX.Y.Z
# tag and puts the result above the image package tables; see AGENTS.md
# (Versions and releases).
#
# Each commit that touches the packages gives one line per "Release-note:"
# line it has, or else its subject. "Release-note: none" leaves it out.

[changelog]
header = ""
body = """
{% if version %}## tmhi {{ version | trim_start_matches(pat="v") }}{% else %}## tmhi (unreleased){% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
{%- set parts = commit.message | split(pat="\nRelease-note:") %}
{%- if parts | length > 1 %}
{%- for part in parts | slice(start=1) %}
- {{ part | split(pat="\n") | first | trim }}
{%- endfor %}
{%- else %}
- {{ commit.message | split(pat="\n") | first | trim }}
{%- endif %}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
# vX.Y.Z only: a vX.Y.Z-rN tag rebuilds the images, not the packages.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
# The files the packages are built from (the same list as the CI cache key).
include_paths = [
  "tmhi",
  "tmhi.init",
  "tmhi.config",
  "tmhi.hotplug",
  "openwrt/tmhi/**",
  "openwrt/luci-app-tmhi/**",
  "openwrt/tmog4ar/**",
]
filter_commits = true
# Release-note lines for commits that were merged without one. Each pattern
# matches one commit's whole subject.
commit_preprocessors = [
  # 16bb766 (#5)
  { pattern = "^(Keep the serving tower when a stale id from the previous tower shows up\n)", replace = "${1}\nRelease-note: History no longer shows fake tower changes when the gateway briefly reports the previous tower's ID after a band change (#4)\n" },
]
# Sections come from the subject's first word; the order is in the comments.
commit_parsers = [
  { message = "(?m)^Release-note: *none *$", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^(Add|Show|Support|Let|Make)\\b", group = "<!-- 0 -->New" },
  { message = "^(Fix|Keep|Stop|Don't|Handle)\\b", group = "<!-- 1 -->Fixed" },
  { message = ".*", group = "<!-- 2 -->Changed" },
]
